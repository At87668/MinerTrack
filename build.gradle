import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

plugins {
    id 'java'
    id 'eclipse'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group 'link.star_dust'
version '2.1.1.0'

sourceCompatibility = 17

// Per-platform bundled (shaded) dependency sets. Each distribution JAR bundles
// only the runtime dependencies its platform needs:
//   shadeCommon — shared by every platform (webhook HTTP transport + JSON)
//   shadeBukkit / shadeFabric / shadeForge / shadeNeoForge — per-platform extras
// These configurations feed the compile classpath (the source imports their
// classes directly) and are consumed individually by the per-platform
// shadowJar tasks at the bottom of this file.
configurations {
    shadeCommon
    shadeBukkit
    shadeFabric
    shadeForge
    shadeNeoForge
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java', 'src/main/stub']
        }
        resources {
            srcDirs = ['src/main/resources']
        }
    }
    test {
        java {
            srcDirs = ['src/test/java']
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'spigotmc-repo'
        url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/'
    }
    maven {
        name = 'papermc-repo'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
    maven {
        name = 'bStats'
        url = 'https://repo.codemc.org/repository/maven-public/'
    }
    maven {
        name = 'Apache'
        url = 'https://maven.aliyun.com/repository/apache-snapshots'
    }
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'Fabric Local (loader)'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'Forge'
        url = 'https://maven.minecraftforge.net/'
    }
    maven {
        name = 'NeoForge'
        url = 'https://maven.neoforged.net/releases'
    }
    maven {
        name = 'faststats'
        url = 'https://repo.faststats.dev/releases'
    }
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'

    // ---- compileOnly: provided by the server at runtime, NOT bundled ----
    // Paper / Folia platform
    compileOnly 'dev.folia:folia-api:1.20.1-R0.1-SNAPSHOT'
    // Fabric platform
    compileOnly 'net.fabricmc.fabric-api:fabric-api:0.77.0+1.18.2'
    compileOnly 'net.fabricmc:fabric-loader:0.14.22'
    // Forge / NeoForge: @Mod annotation is provided by a compile-time stub
    // (link/star_dust/MinerTrack/stub/) to avoid pulling in the full Forge/
    // NeoForge JARs at compile time. At runtime the server provides the real
    // classes.
    // Brigadier is bundled with Minecraft; explicit dep for direct type access
    compileOnly 'com.mojang:brigadier:1.0.18'
    // fabric-permissions-api: delegates to LuckPerms (or op-level fallback).
    // compileOnly — NOT bundled in the JAR. LuckPerms provides its own
    // copy of this API that matches the server's Minecraft version.
    // The fabric.mod.json "recommends" luckperms as a soft dependency.
    compileOnly 'me.lucko:fabric-permissions-api:0.3.3'

    // ---- Bundled (shaded) dependencies, split per platform ----
    // Shared by every platform (webhook HTTP transport + JSON):
    shadeCommon 'org.json:json:20230227'
    shadeCommon 'org.apache.httpcomponents.client5:httpclient5:5.2'
    // Bukkit-only: bStats telemetry (org.bstats.bukkit.Metrics).
    shadeBukkit 'org.bstats:bstats-bukkit:3.0.0'
    // SnakeYAML is the YAML 1.1 parser used by the Fabric / Forge / NeoForge
    // CommonYaml implementations. It MUST be bundled (relocated) because
    // modded servers don't ship SnakeYAML on the classpath, unlike Paper /
    // Spigot which include it transitively through Bukkit. The Bukkit JAR
    // does NOT bundle it (BukkitCommonYaml uses Bukkit's YamlConfiguration).
    shadeFabric 'org.yaml:snakeyaml:2.2'
    shadeForge 'org.yaml:snakeyaml:2.2'
    shadeNeoForge 'org.yaml:snakeyaml:2.2'
    // FastStats metrics SDK (mod platforms only) — replaces the removed bStats
    // mod-platform telemetry. The SDK's core/config modules are platform-agnostic
    // and use the JDK's java.net.http for submission (no extra HTTP dependency);
    // Gson is bundled + relocated so we don't depend on the server's Gson version.
    shadeFabric 'dev.faststats.metrics:core:0.29.4'
    shadeFabric 'dev.faststats.metrics:config:0.29.4'
    shadeFabric 'com.google.code.gson:gson:2.14.0'
    shadeForge 'dev.faststats.metrics:core:0.29.4'
    shadeForge 'dev.faststats.metrics:config:0.29.4'
    shadeForge 'com.google.code.gson:gson:2.14.0'
    shadeNeoForge 'dev.faststats.metrics:core:0.29.4'
    shadeNeoForge 'dev.faststats.metrics:config:0.29.4'
    shadeNeoForge 'com.google.code.gson:gson:2.14.0'
}

// The bundled deps are imported directly by the source, so expose them on the
// compile classpath. Packaging picks per-platform subsets via the shade* configs.
configurations.compileClasspath.extendsFrom(
    configurations.shadeCommon,
    configurations.shadeBukkit,
    configurations.shadeFabric,
    configurations.shadeForge,
    configurations.shadeNeoForge,
)

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

processResources {
    // Expand ${version} in BOTH the Bukkit plugin.yml and the
    // Fabric mod metadata file. Without the second entry the
    // fabric.mod.json shipped to a Fabric server would still
    // contain the literal string "${version}", which Fabric's
    // loader rejects with the "Could not parse version number
    // component '${version}'" warning logged at startup.
    filesMatching(['**/plugin.yml', '**/fabric.mod.json', '**/mods.toml', '**/neoforge.mods.toml']) {
        expand(version: project.version.toString())
    }
}

// The plain jar is disabled — distribution is done by the per-platform
// shadowJar tasks below. Keeping it would produce a misleading
// MinerTrack-<version>.jar (all classes, no deps) in build/libs next to
// the real platform JARs.
jar {
    enabled = false
}

test {
    useJUnitPlatform()
}

// ---- Per-platform shaded distribution JARs -------------------------------
// Each platform JAR contains only:
//   link/star_dust/MinerTrack/common/**  (platform-agnostic contracts + utils)
//   link/star_dust/MinerTrack/core/**    (platform-agnostic detection core)
//   link/star_dust/MinerTrack/<platform>/** (that platform's implementation)
// plus that platform's runtime dependencies and metadata. Output files are
// named MinerTrack-<version>+<platform>.jar (e.g. MinerTrack-2.1.0.1+bukkit.jar).
def platforms = ['bukkit', 'fabric', 'forge', 'neoforge']

def shadeForPlatform = [
    'bukkit':   [configurations.shadeCommon, configurations.shadeBukkit],
    'fabric':   [configurations.shadeCommon, configurations.shadeFabric],
    'forge':    [configurations.shadeCommon, configurations.shadeForge],
    'neoforge': [configurations.shadeCommon, configurations.shadeNeoForge],
]

platforms.each { platform ->
    def others = platforms - platform
    def taskName = "shadowJar${platform.capitalize()}"
    tasks.register(taskName, ShadowJar) {
        group = 'build'
        description = "Build the shaded ${platform} distribution JAR"
        archiveBaseName = 'MinerTrack'
        archiveVersion = "${project.version}+${platform}"
        archiveClassifier = ''
        configurations = shadeForPlatform[platform]
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        dependsOn 'classes'

        // Project classes: common + core + this platform only.
        from(sourceSets.main.output.classesDirs) {
            include 'link/star_dust/MinerTrack/common/**'
            include 'link/star_dust/MinerTrack/core/**'
            include "link/star_dust/MinerTrack/${platform}/**"
            others.each { p -> exclude "link/star_dust/MinerTrack/${p}/**" }
            // Stub annotations for @Mod — compile-time only; the server
            // provides the real net.minecraftforge.fml.common.Mod /
            // net.neoforged.fml.common.Mod.
            exclude 'net/minecraftforge/**'
            exclude 'net/neoforged/**'
        }

        // Project resources: shared config files + this platform's metadata.
        from(sourceSets.main.output.resourcesDir) {
            include 'config.yml'
            include 'Configuration/**'
            include 'language.yml'
            include 'Translations/**'
            switch (platform) {
                case 'bukkit':   include 'plugin.yml'; break
                case 'fabric':   include 'fabric.mod.json'; break
                case 'forge':    include 'META-INF/mods.toml'; break
                case 'neoforge': include 'META-INF/neoforge.mods.toml', 'META-INF/mods.toml'; break
            }
        }

        relocate 'org.bstats', 'link.star_dust.bstats'
        relocate 'org.apache.httpcomponents', 'link.star_dust.httpcomponents'
        // httpclient5 / httpcore5 actually live under org.apache.hc (not
        // org.apache.httpcomponents), so relocate that prefix too — the bundled
        // HTTP stack must never clash with a server-provided copy.
        relocate 'org.apache.hc', 'link.star_dust.hc'
        // org.json (webhook JSON) — relocate so it can't clash with a
        // server-bundled org.json (e.g. Paper ships its own).
        relocate 'org.json', 'link.star_dust.json'
        // Relocate SnakeYAML so the bundled copy does not clash with the
        // server's own copy. Forge 1.20.x / Arclight use JPMS ModuleLayer and
        // fail at boot with "Modules minertrack and org.yaml.snakeyaml export
        // package org.yaml.snakeyaml.events to module forge" (split package)
        // when SnakeYAML is bundled un-relocated. Fabric needs the bundled
        // copy (the server does not ship SnakeYAML), so we relocate instead of
        // excluding it. The Bukkit JAR skips this — it doesn't bundle
        // SnakeYAML at all (BukkitCommonYaml uses Bukkit's YamlConfiguration).
        if (platform != 'bukkit') {
            relocate 'org.yaml.snakeyaml', 'link.star_dust.snakeyaml'
            // FastStats SDK + Gson + Gson's transitive error_prone_annotations —
            // relocate every package we bundle so a server running another mod
            // that provides the same package (e.g. mixinextras ships
            // com.google.errorprone.annotations) doesn't hit a JPMS
            // split-package error (Modules minertrack and X export package ...).
            relocate 'dev.faststats', 'link.star_dust.faststats'
            relocate 'com.google.gson', 'link.star_dust.gson'
            relocate 'com.google.errorprone', 'link.star_dust.errorprone'
        }

        // Do NOT bundle org/slf4j — the server (Forge, NeoForge, Fabric)
        // provides its own slf4j. Bundling a duplicate causes JPMS
        // "Modules X and org.slf4j export package org.slf4j" at boot.
        exclude 'org/slf4j/**'
        // net/fabricmc: fabric-api / fabric-loader are compileOnly (the server
        // provides them); mapping-io is not referenced by any source and is
        // not bundled.
        exclude 'net/fabricmc/**'
        exclude 'net/minecraft/**'
        exclude 'me/lucko/**'
        exclude 'META-INF/maven/**'
        exclude 'META-INF/versions/**'
        exclude 'LICENSE.txt', 'LICENSE'
        exclude 'module-info.class'

        manifest {
            attributes(
                'Implementation-Title': "MinerTrack (${platform})",
                'Implementation-Version': project.version
            )
        }
    }
}

// The shadow plugin's default `shadowJar` task would bundle everything into a
// single all-platform JAR — not what we want. Disable it (so it produces no
// output) and re-route `./gradlew shadowJar` to build ALL per-platform JARs
// (shadowJarBukkit / shadowJarFabric / shadowJarForge / shadowJarNeoforge).
// Disabling a task does not prevent its dependencies from running, so
// `gradlew shadowJar` still executes every platform task.
def platformTasks = platforms.collect { "shadowJar${it.capitalize()}" }

shadowJar {
    enabled = false
    dependsOn platformTasks
}

assemble.dependsOn platformTasks
build.dependsOn platformTasks

#### MinerTrack Anti-Xray Configuration - Configuration/{world}.yml ##############################
#
#   Welcome to MinerTrack anti-xray configuration file for worlds.
#   This file defines world-class settings specifically optimized for anti-xray detection.
#
#  Useful Links:
#  Get Update: https://modrinth.com/plugin/minertrack
#  View Source: https://github.com/At87668/MinerTrack
#  Report Issue: https://github.com/At87668/MinerTrack/issues
#  Pull Requset: https://github.com/At87668/MinerTrack/pulls
